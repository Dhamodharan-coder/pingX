name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ vars.DEPLOY_DIR || '/opt/pingx' }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "
            set -e
            cd $APP_DIR
            git fetch --quiet origin main && git reset --hard origin/main
            docker compose -f docker-compose.vm.yml --env-file .env.production up -d --build --remove-orphans
            docker image prune -f
          "
          rm -f key
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${{ vars.API_DOMAIN }}/health" && exit 0
            sleep 5
          done
          echo "health check failed" && exit 1
